# -*- conf -*-

# shell=$SHELL # (if set, otherwise user's default shell from /etc/passwd)
term=xterm-256color # (or xterm-256color if built with -Dterminfo=disabled)
# login-shell=no

app-id=foot
title=foot
# locked-title=no

font=DejaVuSansMono:size=13
font-bold=DejaVuSansMono-Bold:size=13
font-italic=DejaVuSansMono-Oblique:size=13
font-bold-italic=DejaVuSansMono-BoldOblique:size=13
