#
# Global binding pass
#
bind   =            , F10   , pass, ^(com.obsproject.Studio)$
bindnie =           ,  mouse:275, sendshortcut, , mouse:273, initialtitle:^(Enigmatica.*)
bindni =            , escape, sendshortcut, , code:9, initialtitle:^(Minecraft.*)
bindni =            , escape, sendshortcut, , code:9, class:^(steam_app_739630)

#
# Window bindings
#
bind  = $mod $ctrl , q     , exit
bind  = $mod $shift, q     , exec, hyprlock
bind  = $mod       , tab   , cyclenext
binde = $mod       , q     , killactive
bind  = $mod       , f     , fullscreen, 0
bind  = $mod       , m     , fullscreen, 1
bind  = $mod $shift, space , togglefloating
bind  = $mod $shift, s     , togglesplit # dwindle
bind  = $mod       , space , focusurgentorlast
bind  = $mod $shift, r     , forcerendererreload

#
# Groups (tabs)
#
bind  = $mod $alt       , t    , togglegroup

bind  = $mod $shift $alt, left , moveintogroup, l
bind  = $mod $shift $alt, right, moveintogroup, r
bind  = $mod $shift $alt, up   , moveintogroup, u
bind  = $mod $shift $alt, down , moveintogroup, d

bind  = $mod $shift $alt, t    , moveoutofgroup

bind  = $mod $alt, left        , changegroupactive, b
bind  = $mod $alt, right       , changegroupactive, f

#
# Volume bindings
#
# bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
