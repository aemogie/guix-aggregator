# bind   = , XF86AudioMicMute    , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/application_volume.sh set-volume 5%+ 1.0
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/application_volume.sh set-volume 5%- 1.0
bind  = , XF86AudioMute       , exec, ~/.config/hypr/scripts/application_volume.sh set-mute toggle
bind  = , XF86AudioMicMute    , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

#
# Player bindings
#
bind  = , XF86AudioPlay , exec, playerctl play
bindl = , XF86AudioPause, exec, playerctl pause
bind  = , XF86AudioNext , exec, playerctl next
bind  = , XF86AudioPrev , exec, playerctl previous

#
# Backlight
