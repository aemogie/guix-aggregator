# TODO: group border, etc theme

source = ~/.config/hypr/colors.conf

env = HYPRCURSOR_THEME,McMojave
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,McMojave
env = XCURSOR_SIZE,16

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2

    col.active_border = $white 45deg
    col.inactive_border = $black
}

decoration {
    rounding = 7
    # multisample_edges = true
    active_opacity = 0.90
    inactive_opacity = 0.90
    # This overrides window rules
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 2
        passes = 2
        ignore_opacity = true
        xray = false
        noise = 0.0000
        contrast = 0.8916
        brightness = 0.8172
        special = false
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        sharp = false
        ignore_window=true
        color = rgba(1a1a1aee)
        color_inactive = rgba(1a1a1aee)
        offset = 0 0
        scale = 1.0
    }

    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    dim_around = 0.4
    # screen_shader
}

animations {
    enabled = false

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 1.0, 1.0, 1.0, 1.0

    animation = windows         , 1, 5, myBezier # styles: slide, popin
    animation = windowsIn       , 1, 5, default, popin 0%
    animation = windowsOut      , 1, 5, default, popin 0%
    animation = windowsMove     , 1, 3, default, popin 90%

    animation = fade            , 1, 7, default
    animation = fadeIn          , 1, 10, default
    animation = fadeOut         , 1, 3, default
    animation = fadeSwitch      , 1, 7, default
    animation = fadeDim         , 1, 7, default

    animation = border          , 1, 7, default
    animation = borderangle     , 1, 50, linear, once # once, loop

    animation = workspaces      , 1, 6, default # styles: slide, slidevert, fade
    animation = specialWorkspace, 1, 3, default, slide
}
