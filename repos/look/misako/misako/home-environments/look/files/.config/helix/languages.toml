# Language support configuration.
# See the languages documentation: https://docs.helix-editor.com/master/languages.html

use-grammars = { except = [ "hare", "wren", "gemini" ] }

[language-server]
guile-lsp-server = { command = "guile-lsp-server", args = ["--stdio"] }
jdtls = { command = "jdtls" }

[[language]]
name = "scheme"
scope = "source.scheme"
injection-regex = "scheme"
file-types = ["ss", "scm"]
shebangs = ["scheme", "guile", "chicken"]
comment-token = ";"
indent = { tab-width = 2, unit = "  " }
language-servers = [ "guile-lsp-server" ]
auto-format = false
formatter = { command = "parinfer-rust" }

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'

[[language]]
name = "latex"
scope = "source.tex"
injection-regex = "tex"
file-types = ["tex", "sty", "cls", "Rd", "bbx", "cbx"]
comment-token = "%"
language-servers = [ "texlab" ]
indent = { tab-width = 4, unit = " " }

[[language]]
name = "java"
scope = "source.java"
injection-regex = "java"
file-types = ["java", "jav", "pde"]
roots = ["pom.xml", "build.gradle", "build.gradle.kts"]
language-servers = [ "jdtls" ]
indent = { tab-width = 4, unit = "    " }
comment-tokens = ["//"]
block-comment-tokens = { start = "/*", end = "*/" }

[language-server.texlab]
command = "texlab"

[language-server.texlab.config.texlab.build]
forwardSearchAfter = true
onSave = true

[language-server.texlab.config.texlab.forwardSearch]
executable = "sioyek"
args = [ "--reuse-window", "--execute-command", "toggle_synctex", "--inverse-search", "texlab inverse-search -i \"%%1\" -l %%2", "--forward-search-file", "%f", "--forward-search-line", "%l", "%p" ]
# executable = "zathura"
# args = ["--synctex-forward", "%l:1:%f", "%p"]

[language-server.texlab.config.texlab.chktex]
onEdit = true
