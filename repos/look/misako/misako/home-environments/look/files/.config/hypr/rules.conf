# https://wiki.hyprland.org/Configuring/Window-Rules/

# Supported window rules are:
# class - class regex 
# title - title regex
# initialClass - initialClass regex
# initialTitle - initialTitle regex
# xwayland - 0/1
# floating - 0/1
# fullscreen - 0/1
# pinned - 0/1
# focus - 0/1
# workspace - id or name: and name
# onworkspace (how many windows are on the workspace) - int 

# Telegram
windowrule = float, class:(org.telegram), initialTitle:^(Telegram)$
windowrule = size 25% 80%, class:(org.telegram), initialTitle:^(Telegram)$
windowrule = move 60% 5%, class:(org.telegram), initialTitle:^(Telegram)$
windowrule = opacity 0.95 override 0.8 override, class:(org.telegram), initialTitle:^(Telegram)$
windowrule = noanim, class:(org.telegram), initialTitle:^(Telegram)$

# Disable window pretty effects on applications
windowrule = opaque, class:(chromium-browser|zen|org.pwmt.zathura|mpv|steam_app_.*|vesktop|com.obsproject.Studio|.*.exe|obsidian|sioyek)
windowrule = noblur, class:(chromium-browser|zen|org.pwmt.zathura|mpv|steam_app_.*|vesktop|com.obsproject.Studio|.*.exe|obsidian|sioyek)
windowrule = opaque, initialTitle:(Minecraft.*)
windowrule = noblur, initialTitle:(Minecraft.*)
windowrule = float, title:(Media viewer), class:(TelegramDesktop)
windowrule = opaque, title:(Media viewer), class:(TelegramDesktop)

windowrule = noscreenshare, title:(.*WhatsApp.*), class:(zen)
windowrule = noscreenshare, class:(vesktop)
windowrule = noscreenshare, class:(org.telegram)
layerrule = noscreenshare, notifications

# Tile fix
windowrule = tile, class:^(steam)$
windowrule = content game, class:(steam_app_.*)
windowrule = content game, class:(pathofexilesteam.exe|phasmophobia.exe)

# Specific workspace apps
windowrule = workspace 2, class:(chromium-browser|zen)
windowrule = workspace 8, initialClass:^(steam_app_.*)$
windowrule = workspace 8 silent, initialClass:^(pathofexilesteam\.exe)$
windowrule = workspace 7 silent, class:^(path of building\.exe)$

windowrule = workspace special:telegram silent, class:(org.telegram), initialTitle:^(Telegram)$
windowrule = workspace special:aerc silent, class:^(com.mail.aerc)$
windowrule = workspace special:senpai silent, class:^(com.irc.senpai)$
windowrule = workspace special:newsraft silent, class:^(com.rss.newsraft)$
windowrule = workspace name:spotify silent, class:^(spotify)$
windowrule = workspace name:vesktop silent, initialClass:^(vesktop)$
windowrule = workspace name:steam silent, class:^(steam)$

# Specific monitors workspaces
# workspace = 1, monitor:DP-1,default:true
workspace = 2, monitor:HDMI-A-1, default:true
workspace = 8, monitor:DP-1, default:false
workspace = 9, monitor:HDMI-A-1, default:false
workspace = 10, monitor:HDMI-A-1, default:false
workspace = name:spotify, monitor:HDMI-A-1, default:false
workspace = name:vesktop, monitor:HDMI-A-1, default:false
workspace = name:steam, monitor:HDMI-A-1, default:false
