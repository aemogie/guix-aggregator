source = ~/.config/hypr/colors.conf

general {
    grace = 0
}

background {
    monitor           =
    color             = $bg2
    path              = $HOME/.bg

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur_passes       = 2 # 0 is disabled
    blur_size         = 4
    noise             = 0.01
    contrast          = 1.0
    brightness        = 1.0
    vibrancy          = 0.0
    vibrancy_darkness = 0.0
}

input-field {
    monitor           =
    fade_on_empty     = true
    hide_input        = false
	placeholder_text  =

    position          = 0, -20
    halign            = center
    valign            = center

	size              = 250, 50
    dots_size         = 0.1
    dots_spacing      = 0.3
    dots_center       = true
    outline_thickness = 3

    outer_color       = $black
    inner_color       = $white
    font_color        = $black
}

label {
    monitor     =
    text        = $TIME
    font_size   = 70
    font_family = Cantarell

    color       = $black

    position    = 0, 350
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = $USER
    color       = $black
    font_size   = 25
    font_family = Cantarell

    position    = 0, 80
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:100000] date "+%A, %d %B %Y"
    font_size   = 25
    font_family = Cantarell

    color       = $black

    position    = 0, 250
    halign      = center
    valign      = center
}
