# Bind flags:
# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.

#
# Application bindings
#
# TODO: better handle hardcoded directories

binde = $mod       , return, exec, $term
bind  =            , print , exec, grim -g "$(slurp)" -t png - | wl-copy -t image/png
bind  = $ctrl      , print , exec, grim -g "$(slurp -o)" -t png - | wl-copy -t image/png
bind  = $ctrl $alt , print , exec, grim -t png - | wl-copy -t image/png
bind  = $mod $shift, d     , exec, bemenu-run -i -n -l 5 -p spawn:
# bind  = $mod @shift, b     , exec, sioyek "/home/look/books/$(ls /home/look/books/ | bemenu --no-exec -n -i -l 10 -p Book:)"
bind  = $mod @shift, g     , exec, zathura "$(find /home/look/desktop/graduacao -regex '.*\.pdf' | bemenu --no-exec -n -i -l 10 -p Book:)"
bind  = $mod @shift, b     , exec, zathura "$(find /home/look/books/direito -regex '.*\.pdf' | bemenu --no-exec -n -i -l 10 -p Book:)"

bind  = $mod       , e     , exec, $term -e $editor
bind  = $mod $shift, e     , exec, emacs
bind  = $mod $shift, return, exec, $term -e $fm
bind  = $mod       , b     , exec, zen
bind  = $mod       , z     , exec, mpv "$(wl-paste)"

#
# Global binding pass
#
bindn   =            , F9   , pass, class:^(com.obsproject.Studio)$
# bindie =           ,  mouse:275, sendshortcut, , code:50, class:^(Minecraft)
bindni =            , escape, sendshortcut, , code:9, title:(Minecraft.*)
bindni =            , escape, sendshortcut, , code:9, class:(pathofexilesteam.exe|phasmophobia.exe|steam_app_739630|pioneergame.exe)

#
# Window bindings
#
bind  = $mod $ctrl , q     , exit
bind  = $mod $shift, q     , exec, hyprlock
bind  = $mod       , tab   , cyclenext
binde = $mod       , q     , killactive
bind  = $mod       , f     , fullscreen, 0
bind  = $mod       , m     , fullscreen, 1
bind  = $mod $shift, space , togglefloating
bind  = $mod $shift, s     , togglesplit # dwindle
bind  = $mod       , space , focusurgentorlast
bind  = $mod $shift, r     , forcerendererreload

#
# Groups (tabs)
#
bind  = $mod $alt       , t    , togglegroup

bind  = $mod $shift $alt, left , moveintogroup, l
bind  = $mod $shift $alt, right, moveintogroup, r
bind  = $mod $shift $alt, up   , moveintogroup, u
bind  = $mod $shift $alt, down , moveintogroup, d

bind  = $mod $shift $alt, t    , moveoutofgroup

bind  = $mod $alt, left        , changegroupactive, b
bind  = $mod $alt, right       , changegroupactive, f

#
# Volume bindings
#
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
# bind   = , XF86AudioMute       , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bind   = , XF86AudioMicMute    , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# binde = $ctrl, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/application_volume.sh set-volume 5%+ 1.0
# binde = $ctrl, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/application_volume.sh set-volume 5%- 1.0
# bindel = , XF86AudioRaiseVolume, exec, playerctl -p spotify volume 0.05+
# bindel = , XF86AudioLowerVolume, exec, playerctl -p spotify volume 0.05-
bind  = , XF86AudioMute       , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute    , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

#
# Player bindings
#
bindl = , XF86AudioPlay , exec, playerctl -p spotify play-pause
bindl = , XF86AudioPause, exec, playerctl -p spotify pause
bindl = , XF86AudioStop, exec, playerctl -p spotify stop
bindl = , XF86AudioNext , exec, playerctl -p spotify next
bindl = , XF86AudioPrev , exec, playerctl -p spotify previous

#
# Backlight
#
bindel = , XF86MonBrightnessUp  , exec, light -A 10
bindel = , XF86MonBrightnessDown, exec, light -U 10

bind = $mod $shift, P, pseudo # dwindle

# Move focus with mainMod + arrow keys
bind = $mod, left  , movefocus, l
bind = $mod, right , movefocus, r
bind = $mod, up    , movefocus, u
bind = $mod, down  , movefocus, d

bind = $mod, $down , movefocus, d
bind = $mod, $up   , movefocus, u
bind = $mod, $left , movefocus, l
bind = $mod, $right, movefocus, r

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

binde = $mod, minus      , togglespecialworkspace, telegram
binde = $mod, equal      , togglespecialworkspace, aerc
binde = $mod, bracketleft, togglespecialworkspace, senpai
binde = $mod, dead_acute , togglespecialworkspace, newsraft
binde = $mod, dead_tilde   , workspace, name:spotify
binde = $mod, ccedilla , workspace, name:vesktop
binde = $mod, bracketright , workspace, name:steam
# binde = $mod, minus, focuswindow, class:TelegramDesktop

# Move active window to a workspace with mainMod + $shift + [0-9]
bind = $mod $shift, 1, movetoworkspacesilent, 1
bind = $mod $shift, 2, movetoworkspacesilent, 2
bind = $mod $shift, 3, movetoworkspacesilent, 3
bind = $mod $shift, 4, movetoworkspacesilent, 4
bind = $mod $shift, 5, movetoworkspacesilent, 5
bind = $mod $shift, 6, movetoworkspacesilent, 6
bind = $mod $shift, 7, movetoworkspacesilent, 7
bind = $mod $shift, 8, movetoworkspacesilent, 8
bind = $mod $shift, 9, movetoworkspacesilent, 9
bind = $mod $shift, 0, movetoworkspacesilent, 10

bind = $mod $shift, minus      , movetoworkspace, special:telegram
bind = $mod $shift, equal      , movetoworkspace, special:aerc
bind = $mod $shift, bracketleft, movetoworkspace, special:senpai
bind = $mod $shift, dead_acute , movetoworkspace, special:newsraft
bind = $mod $shift, dead_tilde , movetoworkspace, name:spotify
bind = $mod $shift, ccedilla , movetoworkspace, name:vesktop
bind = $mod $shift, bracketright, movetoworkspace, name:steam

# Move active window around
bind = $mod $shift, right , swapwindow, r
bind = $mod $shift, left  , swapwindow, l
bind = $mod $shift, up    , swapwindow, u
bind = $mod $shift, down  , swapwindow, d

bind = $mod $shift, $right, swapwindow, r
bind = $mod $shift, $left , swapwindow, l
bind = $mod $shift, $up   , swapwindow, u
bind = $mod $shift, $down , swapwindow, d

# Move current workspace to monitor
bind = $mod $ctrl $shift, right , movecurrentworkspacetomonitor, r
bind = $mod $ctrl $shift, left  , movecurrentworkspacetomonitor, l
bind = $mod $ctrl $shift, up    , movecurrentworkspacetomonitor, u
bind = $mod $ctrl $shift, down  , movecurrentworkspacetomonitor, d

bind = $mod $ctrl $shift, $right, movecurrentworkspacetomonitor, r
bind = $mod $ctrl $shift, $left , movecurrentworkspacetomonitor, l
bind = $mod $ctrl $shift, $up   , movecurrentworkspacetomonitor, u
bind = $mod $ctrl $shift, $down , movecurrentworkspacetomonitor, d

#
# Resize windows
#

# will switch to a submap called resize
bind   = $mod, r , submap, resize
# will start a submap called "resize"
submap = resize
# sets repeatable binds for resizing the active window
# WARNING: cannot add spaces between floats!
binde  = , right  , resizeactive,10 0
binde  = , left   , resizeactive,-10 0
binde  = , up     , resizeactive,0 -10
binde  = , down   , resizeactive,0 10

binde  = , $right , resizeactive,10 0
binde  = , $left  , resizeactive,-10 0
binde  = , $up    , resizeactive,0 -10
binde  = , $down  , resizeactive,0 10
# use reset to go back to the global submap
bind   = , escape , submap      , reset
# will reset the submap, meaning end the current one and return to the global one
submap = reset

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

#
# Present mode
#
bind   = $mod, p , submap, present
submap = present
bind   = , m      , exec, wl-present mirror
bind   = , o      , exec, wl-present set-output
bind   = , r      , exec, wl-present set-region
bind   = shift, r , exec, wl-present unset-region
bind   = , s      , exec, wl-present set-scaling
bind   = , f      , exec, wl-present toggle-freeze

# use reset to go back to the global submap
bind   = , escape , submap      , reset
# will reset the submap, meaning end the current one and return to the global one
submap = reset
