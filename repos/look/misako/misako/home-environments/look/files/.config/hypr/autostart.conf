exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = waybar

exec-once = hyprpaper

exec-once = hypridle

exec-once = light -S 15

# exec-once = wlsunset -t 4000 -T 6500 -S 06:30 -s 18:00

exec-once = mako

exec-once = ydotoold

# exec-once = ~/.config/hypr/scripts/socket_handler.sh

# exec-once = wayneko --follow-pointer false --layer overlay

exec-once = $term --gtk-single-instance=false --class=com.mail.aerc -e aerc

exec-once = $term --gtk-single-instance=false --class=com.irc.senpai -e senpai libera

exec-once = $term --gtk-single-instance=false --class=com.rss.newsraft -e newsraft

exec-once = ghostty --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false

exec-once = if [ (hostname) == "yumiko" ]; telegram-desktop; end

exec-once = if [ (hostname) == "yumiko" ]; vesktop; end

# exec-once = spotify

exec-once = if [ (hostname) == "yumiko" ]; steam; end

exec-once = guix shell glib:bin -- gsettings set org.gnome.desktop.interface cursor-theme 'McMojave'

exec-once = guix shell glib:bin -- gsettings set org.gnome.desktop.interface cursor-size 16
